# Copy this file to ./company-audit.yml and replace every sample value.
audit:
  jira:
    base-url: ${JIRA_BASE_URL}
    personal-access-token: ${JIRA_PERSONAL_ACCESS_TOKEN:${JIRA_ACCESS_TOKEN:}}

  # This JQL is the complete audit scope.
  jql: 'project = PAY AND sprint = 123 AND issuetype = Story ORDER BY key ASC'

  # Only Day 3 and Day 10 are supported.
  run-day: ${AUDIT_RUN_DAY}
  page-size: 100

  # Used in the email subject and summary. These values are not parsed from JQL.
  context:
    team-name: ${TEAM_NAME:CHANGE_ME}
    ga-version: ${GA_VERSION:CHANGE_ME}
    sprint-phase: ${SPRINT_PHASE:CHANGE_ME}

  # No SMTP connection is attempted unless this flag is true.
  mail:
    enabled: ${AUDIT_MAIL_ENABLED:false}
    fail-on-error: true
    from: ${AUDIT_MAIL_FROM:audit-sender@company.example}
    to:
      - ${AUDIT_MAIL_TO:audit-recipient@company.example}
    cc: []
    subject: '${TEAM_NAME:CHANGE_ME} - ${GA_VERSION:CHANGE_ME} Audit Report for ${SPRINT_PHASE:CHANGE_ME}'

    # SMTP values are mapped in application.yml from the existing company
    # properties: mail.smtp.host, mail.smtp.port,
    # smptpAuthenticationRequired, smtpHostip, smtpPassword, smtpPort,
    # smtpProtocol, and smtpUsername.

  # Each checkpoint independently declares the fields checked on that day.
  # A field passes when its Jira value matches ANY accepted value.
  # accepted-values is one quoted string. Separate values with $, not commas.
  # Commas inside a Jira value are preserved, for example:
  # 'Not Applicable (POC, Backporting, NoCodeChange)$Suite Pass (90%)'
  checkpoints:
    3:
      fields:
        download:
          label: Download
          jira-field: customfield_10103
          responsible-team: DEV
          accepted-values: 'Started$In Progress$Done - On Time$Not Applicable'
        coding-status:
          label: Coding Status
          jira-field: customfield_10101
          responsible-team: DEV
          accepted-values: 'In Progress$Done - On Time$Not Applicable'
        revised-sp:
          label: Revised SP
          jira-field: customfield_10105
          responsible-team: PMG
          # The field may contain any value, but it must not be empty.
          accepted-values: '__NON_EMPTY__'

    10:
      fields:
        coding-status:
          label: Coding Status
          jira-field: customfield_10101
          responsible-team: DEV
          accepted-values: 'Done - On Time$Not Applicable'
        st-status:
          label: ST Status
          jira-field: customfield_10102
          responsible-team: PQM
          accepted-values: 'Done - On Time$Not Applicable'
        atdd-status:
          label: ATDD Status
          jira-field: customfield_10104
          responsible-team: PQM
          accepted-values: 'Done - On Time$Not Applicable'
        download:
          label: Download
          jira-field: customfield_10103
          responsible-team: DEV
          accepted-values: 'Done - On Time$Not Applicable'
        revised-sp:
          label: Revised SP
          jira-field: customfield_10105
          responsible-team: PMG
          accepted-values: '__NON_EMPTY__'
        gwt-status:
          label: GWT Status
          # Replace this sample with the real GWT Status Jira custom field ID.
          jira-field: customfield_10106
          responsible-team: DEV
          accepted-values: 'Completed$Not Applicable'

      # Scenario Count is conditional on the ATDD Status rule configured under
      # artifacts.day-10.atdd. It may be empty when ATDD is Not Applicable,
      # but must contain a value when ATDD is applicable.
      atdd-scenario-count:
        label: Scenario Count
        # Replace this sample with the real Scenario Count Jira field ID.
        jira-field: customfield_10107
        responsible-team: PQM

      # When the configured GWT field has any completed value below, a Jira
      # comment must contain this prefix followed by a non-empty link/reference.
      completion-comment:
        field-rule: gwt-status
        completed-values: 'Completed'
        comment-prefix: 'Merged feature file link:'

      # Every directly linked issue of this type must have one of these statuses.
      linked-bugs:
        issue-type: Bug
        resolved-statuses: 'Resolved$Closed$Done'

  artifacts:
    # WBS accepts one or more filename markers separated with $.
    # A WBS attachment containing ANY configured marker passes the check.
    # Quote the value so YAML preserves it as one string.
    day-3-wbs-prefix: 'WBS$WORK_BREAKDOWN'

    day-10:
      # WBS is always mandatory and cannot be replaced by a comment.
      wbs-prefix: 'WBS$WORK_BREAKDOWN'

      # not-applicable-values uses the same quoted $ separator as accepted-values.
      # CWC and ST must be absent when their mapped field is Not Applicable;
      # otherwise their attachment or configured standard comment is required.
      cwc:
        prefix: CWC_
        field-rule: coding-status
        not-applicable-values: 'Not Applicable'
        comment-contains: CWC Not Applicable

      # When ATDD Status is Not Applicable, UT must be attached or this comment
      # must exist. When ATDD Status is applicable, UT is optional.
      ut:
        prefix: UT_
        comment-contains: UT Not Applicable

      # If ATDD Status matches not-applicable-values, ATDD is optional and the
      # UT attachment/comment rule above applies. Otherwise ATDD is mandatory.
      # UT and ATDD are allowed to be attached together in either case.
      atdd:
        prefix: ATDD_
        field-rule: atdd-status
        not-applicable-values: 'Not Applicable'

      st:
        prefix: ST_
        field-rule: st-status
        not-applicable-values: 'Not Applicable'
        comment-contains: ST Not Applicable

  report:
    directory: ./reports
    fail-on-violations: true
    fail-on-empty: true

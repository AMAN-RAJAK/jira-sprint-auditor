# Copy this file to company-audit.yml and replace every sample value.
audit:
  jira:
    base-url: ${JIRA_BASE_URL}
    # Jira Server/Data Center PAT. It is sent as Authorization: Bearer <token>.
    personal-access-token: ${JIRA_PERSONAL_ACCESS_TOKEN}

  # This query is the complete audit scope. Include every ticket to report.
  jql: 'project = PAY AND sprint = 123 AND issuetype = Story ORDER BY key ASC'

  # Required on each run. Override with --audit.run-day=1, 3, 7, or 10.
  run-day: ${AUDIT_RUN_DAY}
  page-size: 100

  # Replace the sample custom-field IDs and values with your Jira configuration.
  # Every field has one exact expectation for each supported checkpoint.
  fields:
    coding-status:
      label: Coding Status
      jira-field: customfield_10101
      days:
        1: [Started]
        3: [In Progress]
        7: [Done]
        10: [Done, No Code Changes]

    st-status:
      label: ST Status
      jira-field: customfield_10102
      days:
        1: [Not Started]
        3: [In Progress]
        7: [Done]
        10: [Done, Not Applicable]

    download:
      label: Download
      jira-field: customfield_10103
      days:
        1: [Started]
        3: [In Progress]
        7: [Done]
        10: [Done]

  artifacts:
    # Empty lists mean that no artifacts are checked on that checkpoint.
    # These five named prefixes are mandatory. Additional Day 10 prefixes are
    # allowed, but they remain strictly required and cannot have exceptions.
    required-by-day:
      1: []
      3: [WBS_]
      7: []
      10: [WBS_, CWC_, UT_, ATDD_, ST_]

    # These exact four rules are mandatory. WBS has no exception.
    # For CWC and ST, BOTH the field condition and comment are required.
    # For UT and ATDD, the matching comment is sufficient.
    missing-exceptions:
      CWC_:
        field-rule: coding-status
        field-values: [No Code Changes]
        comment-contains: CWC Not Applicable
      UT_:
        comment-contains: UT Not Applicable
      ATDD_:
        comment-contains: ATDD Not Applicable
      ST_:
        field-rule: st-status
        field-values: [Not Applicable]
        comment-contains: ST Not Applicable

  report:
    directory: ./reports
    fail-on-violations: true
    fail-on-empty: true
